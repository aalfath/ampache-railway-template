# Railway: keep Apache small enough for 0.5 GB services (upstream default is 150 workers).
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild   500
</IfModule>
ServerTokens Prod
ServerName localhost
