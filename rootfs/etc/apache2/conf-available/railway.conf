# Railway: keep Apache small enough for 0.5 GB services (upstream default is 150 workers).
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild   500
</IfModule>
ServerTokens Prod
ServerName localhost

# Health check for Railway, outside the Ampache web root (no login, no .htaccess rewrites).
Alias /healthz /var/www/railway/healthz.php
<Directory /var/www/railway>
    Require all granted
    AllowOverride None
</Directory>
